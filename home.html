<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Library</title>
    <!-- <link rel="stylesheet" href="no-style.css"> -->
    <style>
        .layout {
            display: flex;
            flex-grow: 1;
            flex-shrink: 0;
            flex-direction: row;


        }

        .card {
            background-color: rgb(184, 184, 184);
            height: 50vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            border-radius: 1rem;
        }

        .main-content {
            display: flex;
            gap: 1rem;
            flex-grow: 0;
            flex-wrap: wrap;
        }

        .strength-indicator {
            position: absolute;
            font-size: 0.9rem;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            text-transform: capitalize;
            color: #fff;
            border-radius: 0.5rem;
        }

        .strength-indicator.light {
            background-color: rgb(52, 167, 52);
        }

        .strength-indicator.medium {
            background-color: rgb(184, 175, 56);
        }

        .strength-indicator.strong {
            background-color: rgb(146, 17, 17);
        }
        .card-footer{
            text-align: center;
        }
        .like-button{
            font-size: 1.5rem;
        }
        .like-button span{
        }
    </style>
</head>

<body>
    <div class="layout">


        <header class="site-header">
            <div class="logo">Cocktail Library</div>
            <!-- <button onclick="setFilters(null,[],'light')">Light</button>
            <button onclick="setFilters(null,[],'medium')">Medium</button>
            <button onclick="setFilters(null,[],'strong')">Strong</button> -->

            <!-- <div class="search-bar"><input type="text" name="search" id="search-bar"></div> -->

        </header>
        <div class="sidebar">
            <nav class="nav-bar">

                <!-- <ul id="spiritsList">
                    <li onclick="showAll()">All</li>
                </ul> -->
                <div class="filter" id="filter-str">
                    <!-- <button onclick="runFilters()" style="background-color: green; color: white;">Show Filtered</button> -->
                    <form action="#"></form>
                    <fieldset>
                        <legend>
                            <h2>Spirits</h2>
                        </legend>
                        <div id="spiritsList">
                            <div class="radio-option">
                                <input type="radio" id="all_spirits" name="spirit" value="all_spirits "
                                    onclick="showAll()" checked>
                                <label for="all_spirits">Show all</label>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>
                            <h2>Strength</h2>
                        </legend>
                        <div class="radio-option">
                            <input type="radio" id="all_str" name="strength" value="all_str"
                                onclick="setFilters(null,[], 'all'); runFilters();">
                            <label for="all_str">All</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="light" name="strength" value="light"
                                onclick="setFilters(null,[], 'light'); runFilters();">
                            <label for="light">Light</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="medium" name="strength" value="medium"
                                onclick="setFilters(null,[], 'medium'); runFilters();">
                            <label for="medium">Medium</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="strong" name="strength" value="strong"
                                onclick="setFilters(null,[], 'strong'); runFilters();">
                            <label for="strong">Strong</label>
                        </div>

                    </fieldset>
                    </form>


                </div>
                <div class="filter" id="filter-ing">
                    <h1>Ingredients</h1>

                </div>
            </nav>
        </div>

        <main class="main-content" id="main">
            <div class="card">
                <div class="card-header">
                    <h3 class="title">Cocktail Title</h3>
                </div>
                <div class="card-body">
                    <ul>
                        <li>Base</li>
                        <li>Sweet</li>
                        <li>Sour</li>
                    </ul>
                    <p>Description or maybe the method of making</p>
                </div>
                <div class="card-footer">
                    <div class="like-button">
                        <span>-</span>
                        <span>+</span>
                    </div>
                    <div class="strength-indicator ${cocktail.strength}">Strength</div>
                </div>
            </div>
        </main>
        <!-- <footer class="site-footer">
            <p>Copyright 2025@ Jorge Xar</p>
        </footer> -->
    </div>

    <script src="scripts.js"></script>
</body>

</html>
