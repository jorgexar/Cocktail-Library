<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Library</title>
    <!-- <link rel="stylesheet" href="no-style.css"> -->
    <style>
        .layout{
            display: flex;
            flex-grow: 1;
            flex-shrink: 0;
            flex-direction: row;
            
            
        }
        .cocktail-card{
            background-color: rgb(184, 184, 184);
            height: 50vh;
        }
        .main-content{
            display: flex;
            gap: 1rem;
            flex-grow: 0;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="layout">


        <header class="site-header">
            <div class="logo">Cocktail Library</div>
            <!-- <button onclick="setFilters(null,[],'light')">Light</button>
            <button onclick="setFilters(null,[],'medium')">Medium</button>
            <button onclick="setFilters(null,[],'strong')">Strong</button> -->

            <!-- <div class="search-bar"><input type="text" name="search" id="search-bar"></div> -->

        </header>
        <div class="sidebar">
            <nav class="nav-bar">

                <!-- <ul id="spiritsList">
                    <li onclick="showAll()">All</li>
                </ul> -->
                <div class="filter" id="filter-str">
                    <!-- <button onclick="runFilters()" style="background-color: green; color: white;">Show Filtered</button> -->
                    <form action="#"></form>
                    <fieldset>
                        <legend>
                            <h2>Spirits</h2>
                        </legend>
                        <div id="spiritsList">
                            <div class="radio-option">
                                <input type="radio" id="all_spirits" name="spirit" value="all_spirits " onclick="showAll()" checked>
                                <label for="all_spirits">Show all</label>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>
                            <h2>Strength</h2>
                        </legend>
                        <div class="radio-option">
                            <input type="radio" id="all_str" name="strength" value="all_str"
                                onclick="setFilters(null,[], 'all'); runFilters();">
                            <label for="all_str">All</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="light" name="strength" value="light"
                                onclick="setFilters(null,[], 'light'); runFilters();">
                            <label for="light">Light</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="medium" name="strength" value="medium"
                                onclick="setFilters(null,[], 'medium'); runFilters();">
                            <label for="medium">Medium</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="strong" name="strength" value="strong"
                                onclick="setFilters(null,[], 'strong'); runFilters();">
                            <label for="strong">Strong</label>
                        </div>

                    </fieldset>
                    </form>


                </div>
                <div class="filter" id="filter-ing">
                    <h1>Ingredients</h1>

                </div>
            </nav>
        </div>

        <main class="main-content" id="main">
            
        </main>
        <footer class="site-footer">
            <p>Copyright 2025@ Jorge Xar</p>
        </footer>
    </div>
    
    <script src="scripts.js" ></script>
</body>

</html>
