<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Library</title>
    <link rel="stylesheet" href="alt_style.css">
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="logo">Cocktail Library</div>
        </header>
        <div class="sidebar">
            <nav class="nav-bar">
                <div class="filter" id="filter-str">
                    <fieldset id="ingFilters">
                        <legend>
                            <h2>Ingredients</h2>
                        </legend>
                    </fieldset>
                    <fieldset>
                        <legend>
                            <h2 onclick="document.getElementById('spiritsList').classList.toggle('open')">Spirits</h2>
                        </legend>
                        <div id="spiritsList" class="filterList open">
                            <div class="radio-option">
                                <input type="radio" id="all_spirits" name="spirit" value="all_spirits "
                                    onclick="setFilterSpirit(null); runFilters();" checked>
                                <label for="all_spirits">Show all</label>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>
                            <h2>Strength</h2>
                        </legend>
                        <div class="radio-option">
                            <input type="radio" id="all_str" name="strength" value="all_str"
                                onclick="setFilterStrength(null); runFilters();">
                            <label for="all_str">All</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="light" name="strength" value="light"
                                onclick="setFilterStrength('light'); runFilters();">
                            <label for="light">Light</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="medium" name="strength" value="medium"
                                onclick="setFilterStrength('medium'); runFilters();">
                            <label for="medium">Medium</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="strong" name="strength" value="strong"
                                onclick="setFilterStrength('strong'); runFilters();">
                            <label for="strong">Strong</label>
                        </div>

                    </fieldset>
                    </form>
                </div>
            </nav>
        </div>

        <main class="main-content" id="main">
        </main>
        <footer class="site-footer">
            <p>Copyright 2025@ Jorge Xar</p>
        </footer>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
